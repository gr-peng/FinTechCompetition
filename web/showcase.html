<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f5ff">
<title>FinPilot 你的财务伙伴</title>
<link rel="icon" href="assets/dot.png">
<link rel="stylesheet" href="showcase.css">
<link rel="stylesheet" href="typography.css"></head>
<body>
<div class="sc-backdrop" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="sc-stage">
  <section class="sc-intro">
    <div class="sc-brand"><img src="assets/dot.png" alt=""><span>FinPilot</span></div>
    <h1>钱的事，我陪你。</h1>
    <p class="sc-lede">一个以持续委托为核心的个人财务伙伴。你说一句话，它整理成任务；每一步动钱之前，都先征得你的同意。</p>

    <section class="sc-demo" aria-label="一键演示">
      <h2>看它怎么判断<span>无需连接模型</span></h2>
      <div class="sc-scenes" id="scenes"></div>
      <ol class="sc-trace" id="trace" aria-live="polite"></ol>
      <p class="sc-demo-note" id="demo-note" hidden>演示回放：意图结果为预设，未调用模型；风控、确认和账本都是真实运行的本地程序。</p>
    </section>


    <nav class="sc-tour" aria-label="演示路线">
      <h2>演示路线</h2>
      <ol>
        <li><button type="button" data-route="/today"><em>1</em><span><b>今天</b><small>工资到账，看看怎么安排</small></span></button></li>
        <li><button type="button" data-route="/bot"><em>2</em><span><b>Bot</b><small>交给它一件事，授权后再执行</small></span></button></li>
        <li><button type="button" data-route="/finance"><em>3</em><span><b>财务</b><small>账本、分类图表与预算</small></span></button></li>
        <li><button type="button" data-route="/investment"><em>4</em><span><b>投资</b><small>持仓、银行理财与个股研究</small></span></button></li>
        <li><button type="button" data-route="/me"><em>5</em><span><b>我的</b><small>权限、提醒与模型连接</small></span></button></li>
      </ol>
    </nav>

    <div class="sc-actions">
      <button type="button" class="sc-reset" id="reset">重置演示</button>
      <a id="open-app" href="./?app=1" target="_blank" rel="noopener">单独打开 App ↗</a>
    </div>
    <p class="sc-note">演示数据均为合成，不连接真实银行；默认不调用外部模型。</p>
  </section>

  <section class="sc-device-wrap" aria-label="FinPilot App 预览">
    <div class="sc-device">
      <div class="sc-island" aria-hidden="true"></div>
      <iframe id="app-frame" title="FinPilot App"></iframe>
    </div>
  </section>
</main>
<script type="module" src="showcase.js"></script>
</body>
</html>
